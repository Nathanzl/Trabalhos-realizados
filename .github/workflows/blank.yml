# Fluxo de trabalho básico
name: CI

# Controla quando o fluxo será executado
on:
  push:
    branches: ["principal"]
  pull_request:
    branches: ["principal"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Executa um script de uma linha
        run: echo "Olá, mundo!"

      - name: Executa um script com várias linhas
        run: |
          echo "Adicionar outras ações para construir,"
          echo "testar e implantar seu projeto."
